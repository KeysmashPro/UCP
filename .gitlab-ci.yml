stages:
  - image
  - build
  - release

variables:
  CI_IMAGE: "$CI_REGISTRY_IMAGE/vulkan-ci-build:latest"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

build-ci-image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - changes:
        - Dockerfile-ci
    - when: manual
      allow_failure: true
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_IMAGE" -f Dockerfile-ci .
    - docker push "$CI_IMAGE"

build:
  stage: build
  image: "$CI_IMAGE"
  script:
    - make release
    - make windows
  artifacts:
    paths:
      - build/
    expire_in: 2 weeks

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: 'Automated build'
    assets:
      links:
        - name: 'linux-binary'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/ucp?job=build'
        - name: 'windows-binary'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/build/ucp.exe?job=build'
