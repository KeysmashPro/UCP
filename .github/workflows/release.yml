name: CI Release Build

on:
  push:
    tags:
      - 'v*'
      - 'release*'

permissions:
  contents: write


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker environment
        run: docker build -t ucp-build-env .

      - name: Compile
        ...
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Release ${{ github.ref_name }}
          files: |
            build/ucp
            build/ucp.exe
